[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sanidrive"]
package-dir = {"sanidrive" = "src/sanidrive"}

[tool.setuptools.package-data]
"sanidrive" = ["data/*", "data/**/*"]

[project]
name = "sanidrive"
version = "1.4.0"
authors = [
  { name="Michele Deiana", email="michele.deiana.dev@gmail.com" },
]
description = "Automate appointment lookup on Sardinian public health website"
readme = "README.md"
requires-python = ">=3.12.3"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Windows 64bit",
]
dependencies = [
  "plyer",
  "selenium",
  "requests",
  "bs4",
  "platformdirs"
]

[project.urls]
Homepage = "https://github.com/mdeiana/sanidrive"
Issues = "https://github.com/mdeiana/sanidrive/issues"

[project.scripts]
sanidrive = "sanidrive.sanidrive:main"